name: MiCAR register scrape

on:
  schedule:
    # ESMA republishes the interim register weekly, so exact minute precision
    # doesn't matter much — this runs every hour at :50. Deliberately NOT on
    # the hour (0 * * * *): GitHub's scheduled-workflow queue spikes hardest
    # exactly at :00 because so many repos worldwide schedule there too,
    # which was causing runs to be delayed or dropped entirely.
    - cron: '50 * * * *'
  workflow_dispatch: {}   # allows manually triggering a run from the Actions tab

permissions:
  contents: write

concurrency:
  group: esma-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        id: scrape
        run: python scraper/fetch_esma.py

      - name: Commit data changes (if any)
        # Every run rewrites each register's generated_at + meta.json's
        # last_checked to "now" for freshness, so there's *always* something
        # to commit here — that's expected and separate from whether ESMA's
        # actual register content changed (see steps.scrape.outputs.real_changes
        # below, used to gate the Slack notification).
        run: |
          git config user.name "esma-micar-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update MiCAR register snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # main may have moved (e.g. someone manually uploaded a file via the
            # GitHub web UI) between checkout and this push, so rebase onto the
            # latest remote commit first. Retry a few times in case of a race.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Notify Slack on new data
        # Only fires when fetch_esma.py found genuinely new/changed/removed
        # records (steps.scrape.outputs.real_changes) — not on every run, and
        # not just because generated_at/last_checked timestamps refreshed.
        # Requires a SLACK_WEBHOOK_URL repository secret: a Slack Workflow
        # Builder "From a webhook" trigger URL, with a single text variable
        # named "message" feeding a "Send a message" step. See README.md for
        # the one-time setup. Never fails the workflow if the webhook isn't
        # configured yet or Slack is briefly unreachable.
        if: steps.scrape.outputs.real_changes != '' && steps.scrape.outputs.real_changes != '0'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHANGE_COUNT: ${{ steps.scrape.outputs.real_changes }}
          CHANGE_SUMMARY: ${{ steps.scrape.outputs.change_summary }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret not set — skipping Slack notification."
            exit 0
          fi
          # Slack Workflow Builder webhooks expect a JSON body matching the
          # workflow's own input variable names — not the classic Incoming
          # Webhook {"text": "..."} shape. This assumes a single variable
          # called "message"; rename the key below if yours differs.
          #
          # $summary is NOT wrapped in a ``` code block: Slack renders code
          # blocks as plain monospace and strips all mrkdwn from their
          # contents, which is exactly why the old flat, repetitive-looking
          # notification couldn't use bold/italics/bullets at all. The plain
          # text below lets fetch_esma.py's emoji + *bold*/_italic_ formatting
          # (see run()'s github_output block) render as intended.
          PAYLOAD=$(jq -n \
            --arg count "$CHANGE_COUNT" \
            --arg summary "$CHANGE_SUMMARY" \
            --arg url "https://novarwo.github.io/micar-registers/changelog.html" \
            '{message: ("📋 *MiCAR-register bijgewerkt* — " + $count + " wijziging(en)\n\n" + $summary + "\n\n<" + $url + "|Bekijk de volledige wijzigingsgeschiedenis>")}')
          curl -sf -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
