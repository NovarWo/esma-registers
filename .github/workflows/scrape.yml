name: ESMA MiCAR register scrape

on:
  schedule:
    - cron: '0 * * * *'   # elk uur, op het hele uur (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: esma-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/fetch_esma.py

      - name: Commit data changes (if any)
        run: |
          git config user.name "esma-micar-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update ESMA MiCAR register snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
