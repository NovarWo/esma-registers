name: ESMA MiCAR register scrape

on:
  schedule:
    # ESMA republishes the interim register weekly, so exact minute precision
    # doesn't matter much — this just runs every hour, on the hour (UTC).
    - cron: '0 * * * *'
  workflow_dispatch: {}   # allows manually triggering a run from the Actions tab

permissions:
  contents: write

concurrency:
  group: esma-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/fetch_esma.py

      - name: Commit data changes (if any)
        run: |
          git config user.name "esma-micar-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update ESMA MiCAR register snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # main may have moved (e.g. someone manually uploaded a file via the
            # GitHub web UI) between checkout and this push, so rebase onto the
            # latest remote commit first. Retry a few times in case of a race.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
